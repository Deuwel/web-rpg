<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1119"><title>RE:RPG | 윈드해븐</title><link rel="stylesheet" href="./styles.css"></head>
<body><a class="skip" href="#field">전장으로 이동</a>
<header><div class="wrap mast"><a class="brand" href="./"><i aria-hidden="true"></i>RE<span>:</span>RPG</a>
<div class="wallet" aria-label="보유 재화"><button data-money="gold" aria-label="골드"><i class="coin"></i><b id="gold">0</b></button><button data-money="stone" aria-label="강화석"><i class="ore"></i><b id="stone">0</b></button><button data-money="chaos" aria-label="혼돈 파편"><i class="shard"></i><b id="chaos">0</b></button></div>
<button class="icon" data-open="settings" aria-label="설정">⚙</button><button class="icon" data-open="help" aria-label="도움말">?</button></div></header>
<main class="wrap"><div id="notice" role="status" hidden></div>
<div class="heading"><div><span class="overline">CHAPTER 01 / WINDHAVEN</span><h1>윈드해븐</h1></div><span id="status">마을 정비 중</span></div>
<div class="layout">
<section class="panel journey"><div class="panelhead"><h2>탐험 경로</h2><span>지역 01</span></div><div class="pad">
<div class="route"><div><i>⌂</i><span><b>윈드해븐 마을</b><small>정비와 성장</small></span></div><div><i>◇</i><span><b>변두리 들판</b><small>권장 Lv.5 | Lv.1부터 입장</small></span></div></div>
<label for="depth">탐험 깊이</label><select id="depth"></select>
<div class="spread minor"><span>보스 도전 조건</span><b id="progress">0 / 10승</b></div><div class="bar"><i id="progress-bar"></i></div>
<button id="start" class="primary full">탐험 시작 <b>→</b></button><button id="boss" class="full">감시자 도전 <b>◇</b></button><small id="boss-count"></small>
</div></section>
<section class="panel field" id="field"><div class="panelhead"><div class="inline"><span class="badge" id="live">대기</span><h2>변두리 들판</h2></div><div class="inline field-tools"><button id="pause">일시정지</button><button id="retreat">마을 귀환</button></div></div>
<div id="arena" class="arena"><div class="rings" aria-hidden="true"></div><div class="fighter hero" id="player"><small id="hero-level"></small><strong id="hero-name"></strong><div class="art"><i class="hero-shape"></i></div><div class="vitals"><span>HP</span><b id="hp-count"></b></div><div class="bar"><i id="hp"></i></div><div class="bar mp"><i id="mp"></i></div><div class="bar gauge"><i id="gauge"></i></div><small id="buff"></small></div><div id="enemies"></div><div id="portal"><div class="portal-shape"></div><b id="portal-title">들판 입구</b><small id="portal-note">탐험을 시작하면 적이 등장합니다.</small><button class="launch" id="quick-start">탐험 시작 →</button></div><div id="effects" aria-hidden="true"></div><div class="arenafoot"><span id="last-action"></span><span id="encounter"></span></div></div>
<div class="dock"><div><label>다음 차례 스킬 예약</label><div class="inline" id="reservations"></div></div><div><label>포션 | 턴 소모 없음</label><div class="inline" id="potions"></div></div></div>
<div class="summarystrip"><span id="mp-count"></span><span id="interval"></span><span id="kills"></span></div></section>
<section class="panel tactics"><div class="panelhead"><h2>자동 전술</h2><span class="mint">자동 사용</span></div><div class="pad" id="rule-list"></div><div class="tactic-foot"><small>동순위에서는 조건을 만족한 스킬이 먼저 발동합니다.</small><button class="text" data-open="skills">전사 스킬 습득 ↗</button></div></section>
<section class="panel character"><div class="panelhead"><h2>캐릭터</h2><button class="text" data-open="stats">스탯 상세 ↗</button></div><div class="pad"><div class="level"><b id="level"></b><div><strong id="name"></strong><small id="class-name"></small></div></div><div class="spread minor"><span>EXP</span><span id="xp"></span></div><div class="bar mp"><i id="xp-bar"></i></div><div id="overview"></div><button class="full" data-open="stats" id="points"></button></div></section>
<section class="panel bag"><div class="panelhead"><div class="inline"><button id="bag-tab" class="tab">가방</button><button id="gear-tab" class="tab">장착 장비</button></div><small id="bag-count"></small></div>
<div class="bagtools"><select id="filter" aria-label="장비 종류 필터"><option value="">모든 부위</option><option value="weapon">무기</option><option value="armor">갑옷</option><option value="necklace">목걸이</option></select><select id="sort" aria-label="장비 정렬"><option value="recent">최근 획득</option><option value="rarity">등급순</option><option value="level">레벨순</option></select></div><p id="overflow" hidden></p><div id="items"></div></section>
<section class="panel record"><div class="panelhead"><h2>전투 기록</h2><span id="clock">00:00</span></div><ol id="logs" tabindex="0" aria-label="최근 전투 기록"></ol></section></div>
<footer><span>A 단계 | 전투와 파밍</span><span id="saved"></span></footer></main>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="panelhead"><h2 id="dialog-title"></h2><button id="close" class="icon" aria-label="닫기">×</button></div><div id="dialog-body"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./src/ui.js"></script></body></html>
